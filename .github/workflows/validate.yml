name: Validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q plugin.video.aiostreams plugin.video.imvdb script.aiodi.onboarding skin.AIODI/resources/lib
      - name: Parse XML resources
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          [ET.parse(path) for path in Path('.').rglob('*.xml') if '.git' not in path.parts]"
